<template>
  <style>
    #root { position: absolute; inset: 0; background: #05080d; overflow: hidden; }
    #s-footage { position: absolute; inset: 0; width: 1920px; height: 1080px; object-fit: cover; }
    #s-scrim { position: absolute; inset: 0; background: linear-gradient(to right, rgba(3,5,9,0.82) 0%, rgba(3,5,9,0.5) 38%, rgba(3,5,9,0) 55%); }
    #s-fx { position: absolute; inset: 0; }
    .s-title { position: absolute; left: 144px; top: 120px; font-size: 76px; font-weight: 900; letter-spacing: -0.03em; line-height: 1.05; max-width: 900px; }
    .s-title span { display: inline-block; margin-right: 0.22em; }
    .s-title .accent { color: #ff9a3c; }
    #s-eq { position: absolute; left: 148px; top: 330px; font-family: "JetBrains Mono", monospace; font-size: 32px; color: #9fb4c8; letter-spacing: 0.04em; }
    #s-temp { position: absolute; right: 144px; top: 120px; text-align: right; }
    #s-temp .k { font-family: "JetBrains Mono", monospace; font-size: 28px; color: #8193a6; letter-spacing: 0.14em; }
    #s-temp .v { font-size: 88px; font-weight: 900; letter-spacing: -0.03em; color: #ffb070; }
  </style>
  <div id="root" data-composition-id="steam" data-width="1920" data-height="1080">
    <!-- rendered in Blender (Cycles): boiling glass, bubbles and a churning surface; the camera pulls back from the rim -->
    <video id="s-footage" class="clip" src="assets/video/outro.mp4" data-start="0" data-duration="5.5" muted></video>
    <!-- steam is drawn here, over the footage, once the camera has settled -->
    <svg id="s-fx" width="1920" height="1080" viewBox="0 0 1920 1080">
      <defs><filter id="s-blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10" /></filter></defs>
      <g id="s-steam" filter="url(#s-blur)" fill="none" stroke="#eef4f8" stroke-linecap="round"></g>
    </svg>
    <div id="s-scrim"></div>
    <h1 class="s-title" id="s-title"><span>At</span><span class="accent">100 °C,</span><span>liquid</span><span>water</span><span>becomes</span><span>gas.</span></h1>
    <div id="s-eq">H₂O (liquid) → H₂O (gas)</div>
    <div id="s-temp"><div class="k">TEMPERATURE</div><div class="v">100 °C</div></div>
  </div>
  <script>
    (() => {
      // glass mouth centre and water surface in the footage once the camera has settled (measured on frame 60, 1920×1080 px)
      const RIM_X = 1195, SURF_Y = 480, RIM_HALF = 190;
      const NS = "http://www.w3.org/2000/svg";
      function rng(s) { return () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
      const R = rng(21);
      const steamG = document.getElementById("s-steam");
      const wisps = Array.from({ length: 9 }, (_, i) => { const p = document.createElementNS(NS, "path"); steamG.appendChild(p); return { el: p, x0: RIM_X - RIM_HALF * 0.7 + (i % 5) * RIM_HALF * 0.35 + R() * 16, per: 2.4 + R() * 1.2, ph: R(), amp: 16 + R() * 18 }; });
      function render(t) {
        const show = Math.min(1, Math.max(0, (t - 1.1) / 0.6));
        wisps.forEach((w, i) => {
          const a = (t / w.per + w.ph) % 1, y = SURF_Y - a * 470, x = w.x0 + Math.sin(a * 5 + i) * 18 * a;
          w.el.setAttribute("d", `M${x} ${y} q ${w.amp} -50 0 -100 q ${-w.amp} -50 0 -100`);
          w.el.setAttribute("stroke-width", (14 + a * 24).toFixed(1));
          w.el.setAttribute("opacity", (0.42 * show * Math.sin(Math.PI * a)).toFixed(3));
        });
      }
      const tl = gsap.timeline({ paused: true });
      const clock = { t: 0 };
      tl.fromTo(clock, { t: 0 }, { t: 5.5, duration: 5.5, ease: "none", onUpdate: () => render(clock.t) }, 0);
      tl.fromTo("#s-scrim", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power2.inOut" }, 0.9);
      tl.fromTo("#s-temp", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 0.3);
      tl.fromTo("#s-title span", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.13, stagger: 0.067, ease: "power4.out" }, 1.35);
      tl.fromTo("#s-eq", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power2.out" }, 2.0);
      render(0);
      window.__timelines["steam"] = tl;
    })();
  </script>
</template>
