        const r = T[Math.min(T.length - 1, Math.max(0, Math.floor(t * FPS + 1e-6)))];
        const [ox, oy, ax, ay, bx, by, mx, my] = r;
        const la = Math.hypot(ax - ox, ay - oy), lb = Math.hypot(bx - ox, by - oy), R = 1.3 * Math.min(la, lb);

        ray1.setAttribute("d", `M${ox + s * la * Math.cos(a0)} ${oy + s * la * Math.sin(a0)} L${p0[0]} ${p0[1]}`);
        ray2.setAttribute("d", `M${ox + s * lb * Math.cos(a1)} ${oy + s * lb * Math.sin(a1)} L${p1[0]} ${p1[1]}`);
        let d = a1 - a0; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI;
        arc.setAttribute("d", `M${p0[0]} ${p0[1]} A ${R} ${R} 0 0 ${d > 0 ? 1 : 0} ${p1[0]} ${p1[1]}`);
        const am = a0 + d / 2;
        ang.style.transform = `translate(${ox + (R + 52) * Math.cos(am) - 92}px, ${oy + (R + 52) * Math.sin(am) - 28}px)`;
        // hydrogen-bond label sits up and to the left of the bond it names

        const tw = 360, tx = Math.max(100, mx - 40 - tw), ty = my - 120;

        hb.style.transform = `translate(${tx}px, ${ty}px)`;
      }

      const clock = { t: 0 };
      tl.fromTo(clock, { t: 0 }, { t: 7, duration: 7, ease: "none", onUpdate: () => render(clock.t) }, 0);
      tl.fromTo("#m-footage", { opacity: 0.2, filter: "blur(10px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.7, ease: "expo.out" }, 0);

      tl.to("#m-title span", { opacity: 0, filter: "blur(8px)", duration: 0.13, stagger: 0.03, ease: "power2.in" }, 4.7);
      tl.fromTo("#m-angle-g", { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power2.out" }, 2.2);
      tl.fromTo("#m-angle", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power4.out" }, 2.45);
      tl.fromTo("#m-lead", { strokeDasharray: 300, strokeDashoffset: 300 }, { strokeDashoffset: 0, duration: 0.4, ease: "power2.inOut" }, 2.8);
      tl.fromTo("#m-hb", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power4.out" }, 3.05);
      tl.to(["#m-angle-g", "#m-angle", "#m-lead", "#m-hb"], { opacity: 0, duration: 0.18, ease: "power2.in" }, 5.1);
      tl.fromTo("#m-dark", { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power2.in" }, 6.6);
      render(0);
      window.__timelines["molecules"] = tl;
    })();
  </script>
