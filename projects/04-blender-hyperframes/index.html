<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="lib/gsap.min.js"></script>
    <script src="lib/h2o.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #070b12; }
      #root { width: 100%; height: 100%; font-family: Inter, sans-serif; color: #e8eef4; }
      #ground { position: absolute; inset: 0; background: #070b12; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="30" data-width="1920" data-height="1080">
      <div id="ground"></div>
      <div id="glass" data-composition-id="glass" data-composition-src="compositions/glass.html" data-start="0" data-duration="5.5" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="molecules" data-composition-id="molecules" data-composition-src="compositions/molecules.html" data-start="5.5" data-duration="7" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="atom" data-composition-id="atom" data-composition-src="compositions/atom.html" data-start="12.5" data-duration="5" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="heat" data-composition-id="heat" data-composition-src="compositions/heat.html" data-start="17.5" data-duration="7" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="steam" data-composition-id="steam" data-composition-src="compositions/steam.html" data-start="24.5" data-duration="5.5" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>

      <!-- music bed: cool minor while still, brightens to D major as the water boils (synthesized) -->
      <audio id="bed" src="assets/audio/bed.wav" data-start="0" data-duration="30" data-volume="0.28" data-track-index="2"></audio>
      <!-- zoom through the water: peak (2.55 s into the file) lands as the frame floods blue -->
      <audio id="sfx-dive" src="assets/sfx/whoosh-cinematic.mp3" data-start="2.65" data-duration="5.5" data-volume="0.42" data-track-index="3"></audio>
      <!-- dive into the oxygen atom -->
      <audio id="sfx-into-atom" src="assets/sfx/whoosh-short.mp3" data-start="12.27" data-duration="0.57" data-volume="0.5" data-track-index="3"></audio>
      <!-- pull back out of the atom (a different take) -->
      <audio id="sfx-out-atom" src="assets/sfx/whoosh.mp3" data-start="17.27" data-duration="0.57" data-volume="0.45" data-track-index="3"></audio>
      <!-- heat builds into 100 °C -->
      <audio id="sfx-riser" src="assets/sfx/riser.mp3" data-start="18.45" data-duration="3.3" data-volume="0.2" data-fade-out="0.06" data-track-index="4"></audio>
      <audio id="sfx-boil-hit" src="assets/sfx/impact-bass-1.mp3" data-start="21.66" data-duration="2.1" data-volume="0.55" data-track-index="6"></audio>
      <!-- boiling: bubble rate follows the on-screen temperature, steam hiss on the final glass (synthesized) -->
      <audio id="boil" src="assets/audio/boil.wav" data-start="17.5" data-duration="12.5" data-volume="0.5" data-track-index="5"></audio>
      <!-- voiceover: Kokoro TTS (am_michael), generated locally, one clip per scene -->
      <audio id="vo-glass" src="assets/audio/vo-glass.wav" data-start="0.9" data-duration="1.75" data-volume="1.6" data-track-index="7"></audio>
      <audio id="vo-molecules" src="assets/audio/vo-molecules.wav" data-start="5.7" data-duration="6.02" data-volume="1.6" data-track-index="7"></audio>
      <audio id="vo-atom" src="assets/audio/vo-atom.wav" data-start="12.65" data-duration="4.44" data-volume="1.6" data-track-index="7"></audio>
      <audio id="vo-heat" src="assets/audio/vo-heat.wav" data-start="17.9" data-duration="4.78" data-volume="1.6" data-track-index="7"></audio>
      <audio id="vo-steam" src="assets/audio/vo-steam.wav" data-start="25.9" data-duration="1.81" data-volume="1.6" data-track-index="7"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
