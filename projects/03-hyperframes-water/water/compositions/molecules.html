<template>
  <style>
    #root { position: absolute; inset: 0; background: #14507e; overflow: hidden; }
    #m-bg { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 50%, #0f3d63 0%, #0a2742 80%); }
    #m-canvas { position: absolute; inset: 0; width: 1920px; height: 1080px; }
    #m-dark { position: absolute; inset: 0; background: radial-gradient(circle at 50% 50%, #1b2840 0%, #05080f 60%); opacity: 0; }
    #m-scrim { position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(5,12,22,0.75) 0%, rgba(5,12,22,0) 32%); }
    .m-title { position: absolute; left: 144px; top: 120px; font-size: 76px; font-weight: 900; letter-spacing: -0.03em; line-height: 1.05; max-width: 1500px; }
    .m-title span { display: inline-block; margin-right: 0.22em; }
    .m-title .accent { color: #ff7f6e; }
    .m-label { position: absolute; font-family: "JetBrains Mono", monospace; font-size: 36px; font-weight: 500; text-shadow: 0 2px 10px rgba(0,0,0,0.8); white-space: nowrap; }
    #m-lines { position: absolute; inset: 0; }
  </style>
  <div id="root" data-composition-id="molecules" data-width="1920" data-height="1080">
    <div id="m-bg"></div>
    <canvas id="m-canvas" width="1920" height="1080"></canvas>
    <div id="m-scrim"></div>
    <h1 class="m-title" id="m-title"><span>Each</span><span>one:</span><span class="accent">one</span><span class="accent">oxygen,</span><span>two</span><span>hydrogens.</span></h1>
    <svg id="m-lines" width="1920" height="1080" viewBox="0 0 1920 1080">
      <path id="m-arc" fill="none" stroke="#ffd27a" stroke-width="3" />
      <path id="m-lead" fill="none" stroke="#9fd6f2" stroke-width="2" />
    </svg>
    <div class="m-label" id="m-angle" style="color:#ffd27a">104.5°</div>
    <div class="m-label" id="m-hb" style="color:#9fd6f2">hydrogen bond</div>
    <div id="m-dark"></div>
  </div>
  <script>
    (() => {
      const cv = document.getElementById("m-canvas"), ctx = cv.getContext("2d");
      const { drawMolecules, centerGeometry, clamp } = window.H2O;
      const D = 7;
      const easeOut = x => 1 - Math.pow(1 - x, 4), easeIn = x => x * x * x;
      function zoomAt(t) {
        const zin = 0.35 + 0.65 * easeOut(clamp(t / 1.3));        // continue the dive from the glass
        const dive = Math.exp(Math.log(7) * easeIn(clamp((t - 5.4) / 1.5))); // into the centre oxygen
        return zin * dive;
      }
      function render(t) { drawMolecules(ctx, 1920, 1080, { tau: t + 3, heat: 0, vapor: 0, zoom: zoomAt(t), bondAlpha: clamp((t - 0.6) / 0.6) }); }

      // labels: measure the geometry once, at the moment they appear
      const g = centerGeometry(1920, 2.2 + 3);
      const [ox, oy] = g.o;
      const r = 80, a0 = Math.atan2(g.h1[1] - oy, g.h1[0] - ox), a1 = Math.atan2(g.h2[1] - oy, g.h2[0] - ox);
      const p0 = [ox + r * Math.cos(a0), oy + r * Math.sin(a0)], p1 = [ox + r * Math.cos(a1), oy + r * Math.sin(a1)];
      document.getElementById("m-arc").setAttribute("d", `M${p0[0]} ${p0[1]} A ${r} ${r} 0 0 1 ${p1[0]} ${p1[1]}`);
      const am = (a0 + a1) / 2;
      const ang = document.getElementById("m-angle");
      ang.style.left = (ox + 128 * Math.cos(am) - 54) + "px"; ang.style.top = (oy + 128 * Math.sin(am) - 22) + "px";
      const [bx, by] = g.bondMid, lx = bx + 150, ly = by + 120;
      document.getElementById("m-lead").setAttribute("d", `M${bx} ${by} L${lx - 10} ${ly - 6}`);
      const hb = document.getElementById("m-hb"); hb.style.left = lx + "px"; hb.style.top = (ly - 18) + "px";

      const tl = gsap.timeline({ paused: true });
      const clock = { t: 0 };
      tl.fromTo(clock, { t: 0 }, { t: D, duration: D, ease: "none", onUpdate: () => render(clock.t) }, 0);
      tl.fromTo("#m-canvas", { filter: "blur(10px)", opacity: 0.2 }, { filter: "blur(0px)", opacity: 1, duration: 0.7, ease: "expo.out" }, 0);
      tl.fromTo("#m-title span", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.13, stagger: 0.067, ease: "power4.out" }, 0.9);
      tl.to("#m-title span", { opacity: 0, filter: "blur(8px)", duration: 0.13, stagger: 0.03, ease: "power2.in" }, 4.7);
      tl.fromTo("#m-arc", { strokeDasharray: 300, strokeDashoffset: 300 }, { strokeDashoffset: 0, duration: 0.5, ease: "power2.inOut" }, 2.2);
      tl.fromTo("#m-angle", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power4.out" }, 2.45);
      tl.fromTo("#m-lead", { strokeDasharray: 300, strokeDashoffset: 300 }, { strokeDashoffset: 0, duration: 0.4, ease: "power2.inOut" }, 2.8);
      tl.fromTo("#m-hb", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power4.out" }, 3.05);
      tl.to(["#m-arc", "#m-angle", "#m-lead", "#m-hb"], { opacity: 0, duration: 0.18, ease: "power2.in" }, 5.1);
      tl.fromTo("#m-dark", { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power2.in" }, 6.6);
      render(0);
      window.__timelines["molecules"] = tl;
    })();
  </script>
</template>
